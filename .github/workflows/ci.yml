name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # JWT test keys are not committed, so generate a throwaway pair for the run.
      - name: Generate test JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/jwt-private.pem"
          openssl rsa -pubout -in "$RUNNER_TEMP/jwt-private.pem" \
            -out "$RUNNER_TEMP/jwt-public.pem"
          {
            echo "JWT_PRIVATE_KEY=$(base64 -w0 "$RUNNER_TEMP/jwt-private.pem")"
            echo "JWT_PUBLIC_KEY=$(base64 -w0 "$RUNNER_TEMP/jwt-public.pem")"
          } >> "$GITHUB_ENV"

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build
