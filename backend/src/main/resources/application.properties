spring.application.name=fruitify-store-backend
spring.jpa.hibernate.ddl-auto=validate
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.private-key=${JWT_PRIVATE_KEY:}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?user=postgres&password=mysecretpassword}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.domain=${APP_DOMAIN:http://localhost:4200}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

app.cors.allowed-origins=${APP_DOMAIN:http://localhost:4200}